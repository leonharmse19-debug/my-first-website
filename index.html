<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARPG Build Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ARPG Build Tracker</h1>

        <div class="card">
            <h3>Import New Build</h3>
            <div class="input-group">
                <input type="text" id="build-url" placeholder="Paste build planner URL here...">
                <button id="btn-import" class="btn">Import Build</button>
            </div>
        </div>

        <div class="builds-grid" id="builds-container">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
