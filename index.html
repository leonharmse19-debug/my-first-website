<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting elegant digital experiences</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="intro-section">
      <div class="page-content">
        <span class="section-label">About Me</span>
        <h1>Crafting elegant digital experiences with a bold aesthetic.</h1>
        <p class="section-copy">I am a creative developer who enjoys turning modern design into intuitive websites. My focus is on polished visuals, fast interactions, and clean code that feels effortless.</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="page-content">
        <span class="section-label">Contact</span>
        <h2>Let's build something together.</h2>
        <form class="contact-form" action="#" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell me about your project"></textarea>

          <button type="submit" class="primary-button">Send Message</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
